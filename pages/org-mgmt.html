<meta charset="UTF-8">

<title>组织机构管理 - 视联网消防告警运营平台</title>

<style>
body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text-primary);margin:0;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);height:100vh;display:flex;flex-direction:column;transition:width .25s,transform .25s;overflow:hidden;position:relative;z-index:100}
.sidebar.collapsed{width:64px;min-width:64px}
.sidebar.collapsed .sidebar-text,.sidebar.collapsed .group-arrow,.sidebar.collapsed .sidebar-user-info{display:none}
.sidebar.collapsed .menu-item{justify-content:center;padding-left:0;padding-right:0}
.sidebar.collapsed .menu-item .menu-icon{margin-right:0}
.sidebar.collapsed .group-header{justify-content:center;padding-left:0;padding-right:0}
.sidebar.collapsed .group-header .group-label{display:none}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;cursor:pointer;color:#8899aa;font-size:12px;font-weight:600;letter-spacing:.5px;user-select:none}
.group-header:hover{color:#a0b4c8}
.group-label{flex:1;white-space:nowrap}
.group-arrow{transition:transform .2s;font-size:10px;color:#667788}
.group-arrow.open{transform:rotate(90deg)}
.group-menu{overflow:hidden;transition:max-height .3s ease}
.group-menu.closed{max-height:0!important}
.menu-item{display:flex;align-items:center;padding:9px 16px 9px 20px;margin:2px 8px;border-radius:var(--radius-md);color:var(--sidebar-text);text-decoration:none;font-size:var(--text-sm);cursor:pointer;transition:all .15s;white-space:nowrap;border-left:3px solid transparent}
.menu-item:hover{background:rgba(255,255,255,.08);color:#fff}
.menu-item.active{background:var(--sidebar-active-bg);color:#fff;font-weight:var(--font-medium);border-left:3px solid #3b82f6}
.menu-icon{width:18px;height:18px;margin-right:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sidebar-text{flex:1;overflow:hidden;text-overflow:ellipsis}
.sidebar-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;margin-top:auto}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.sidebar-user-info{overflow:hidden}
.sidebar-user-name{font-size:var(--text-sm);color:#fff;font-weight:var(--font-medium)}
.sidebar-user-role{font-size:var(--text-xs);color:var(--sidebar-text)}
.topbar{height:56px;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-6);gap:var(--space-4);flex-shrink:0}
.breadcrumb{font-size:var(--text-sm);color:var(--color-text-secondary)}
.breadcrumb span{color:var(--color-text-muted)}
.breadcrumb a{color:var(--color-text-secondary);text-decoration:none}
.breadcrumb a:hover{color:var(--color-primary)}
.topbar-search{position:relative}
.topbar-search input{width:220px;height:34px;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:0 12px 0 34px;font-size:var(--text-sm);background:var(--color-bg);outline:none;transition:border-color .2s}
.topbar-search input:focus{border-color:var(--color-primary)}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-text-muted)}
.bell-btn{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);cursor:pointer;transition:all .15s}
.bell-btn:hover{background:var(--color-bg);border-color:var(--color-primary)}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--state-error);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bell-dropdown{position:absolute;top:100%;right:0;margin-top:4px;width:320px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:400;display:none}
.bell-dropdown.show{display:block}
.bell-dd-header{padding:12px 16px;border-bottom:1px solid var(--color-border-light);font-size:var(--text-sm);font-weight:var(--font-semibold)}
.bell-dd-item{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--color-border-light);cursor:pointer;transition:background .1s}
.bell-dd-item:last-child{border-bottom:none}
.bell-dd-item:hover{background:var(--color-bg)}
.bell-dd-dot{width:8px;height:8px;border-radius:50%;background:var(--state-error);margin-top:4px;flex-shrink:0}
.bell-dd-text{font-size:var(--text-sm);color:var(--color-text-primary);line-height:1.4}
.bell-dd-time{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px}
.user-dropdown{position:relative;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:var(--radius-md);transition:background .15s}
.user-dropdown:hover{background:var(--color-bg)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.user-dd-menu{position:absolute;top:100%;right:0;margin-top:4px;width:150px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:400;display:none}
.user-dd-menu.show{display:block}
.user-dd-item{padding:8px 14px;font-size:var(--text-sm);cursor:pointer;transition:background .1s;color:var(--color-text-primary)}
.user-dd-item:hover{background:var(--color-bg)}
.content-area{flex:1;overflow-y:auto;padding:var(--space-6)}
.toast-container{position:fixed;top:70px;right:24px;z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:var(--font-medium);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .3s ease;min-width:240px}
.toast.success{background:var(--state-success-bg);color:var(--state-success);border:1px solid rgba(22,163,74,.2)}
.toast.error{background:var(--state-error-bg);color:var(--state-error);border:1px solid rgba(220,38,38,.2)}
.toast.info{background:var(--state-info-bg);color:var(--state-info);border:1px solid rgba(59,130,246,.2)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.page-header{margin-bottom:var(--space-6)}
.page-title{font-size:var(--text-xl);font-weight:var(--font-bold);color:var(--color-text-primary);margin:0 0 4px}
.page-desc{font-size:var(--text-sm);color:var(--color-text-secondary);margin:0}
.page-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--shadow-sm);margin-bottom:var(--space-6)}
.data-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.data-table thead{background:var(--color-bg);position:sticky;top:0;z-index:5}
.data-table th{padding:10px 12px;text-align:left;font-weight:500;color:var(--color-text-secondary);border-bottom:2px solid var(--color-border);white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--color-border-light);vertical-align:middle}
.data-table tbody tr{transition:background .12s;cursor:pointer}
.data-table tbody tr:hover{background:var(--color-primary-bg)}
.status-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
.status-tag.blue{background:var(--state-info-bg);color:var(--state-info)}
.status-tag.orange{background:var(--state-warning-bg);color:var(--state-warning)}
.status-tag.green{background:var(--state-success-bg);color:var(--state-success)}
.btn-sm{height:32px;padding:0 14px;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-light)}
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;display:none;align-items:center;justify-content:center}
.dialog-overlay.show{display:flex}
.dialog{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:520px;max-width:90vw;max-height:80vh;overflow-y:auto}
.dialog-header{padding:16px 20px;border-bottom:1px solid var(--color-border);font-size:var(--text-lg);font-weight:var(--font-semibold);display:flex;align-items:center;justify-content:space-between}
.dialog-close{width:28px;height:28px;border-radius:var(--radius-sm);border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);transition:background .15s}
.dialog-close:hover{background:var(--color-bg);color:var(--color-text-primary)}
.dialog-body{padding:20px}
.dialog-footer{padding:12px 20px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:var(--space-3)}
.dialog-label{font-size:var(--text-sm);font-weight:var(--font-medium);margin-bottom:6px;color:var(--color-text-primary)}
.dialog-input{width:100%;height:36px;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:0 12px;font-size:var(--text-sm);outline:none;background:var(--color-surface);transition:border-color .2s}
.dialog-input:focus{border-color:var(--color-primary)}
.dialog-select{width:100%;height:36px;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:0 10px;font-size:var(--text-sm);outline:none;background:var(--color-surface);cursor:pointer}
.dialog-select:focus{border-color:var(--color-primary)}
.btn-cancel{height:34px;padding:0 20px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-sm);cursor:pointer;transition:all .15s;color:var(--color-text-primary)}
.btn-cancel:hover{background:var(--color-bg)}
.btn-confirm{height:34px;padding:0 20px;border:none;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:var(--font-semibold);cursor:pointer;transition:all .15s;color:#fff;background:var(--color-primary)}
.btn-confirm:hover{filter:brightness(1.08)}
/* Org tree */
.org-layout{display:flex;gap:var(--space-6);margin-bottom:var(--space-6)}
.org-tree-panel{width:320px;min-width:320px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
.org-tree-header{padding:12px 16px;border-bottom:1px solid var(--color-border);font-size:var(--text-sm);font-weight:var(--font-semibold);color:var(--color-text-primary);display:flex;align-items:center;justify-content:space-between}
.org-tree-search{margin:8px 12px;position:relative}
.org-tree-search input{width:100%;height:30px;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:0 10px 0 28px;font-size:var(--text-xs);outline:none;background:var(--color-bg);transition:border-color .2s}
.org-tree-search input:focus{border-color:var(--color-primary)}
.org-tree-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--color-text-muted)}
.org-tree-body{flex:1;overflow-y:auto;padding:4px 0}
.tree-node{cursor:pointer;user-select:none}
.tree-node-row{display:flex;align-items:center;gap:4px;padding:6px 12px;font-size:var(--text-sm);color:var(--color-text-primary);transition:background .12s;border-radius:var(--radius-md);margin:1px 8px}
.tree-node-row:hover{background:var(--color-bg)}
.tree-node-row.active{background:var(--color-primary-bg);color:var(--color-primary);font-weight:var(--font-medium)}
.tree-arrow{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-muted);transition:transform .2s;flex-shrink:0}
.tree-arrow.open{transform:rotate(90deg)}
.tree-arrow.leaf{visibility:hidden}
.tree-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--color-primary)}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-badge{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--color-bg);color:var(--color-text-muted);margin-left:4px;flex-shrink:0}
.tree-children{overflow:hidden;transition:max-height .2s ease}
.tree-children.closed{max-height:0!important}
/* Detail panel */
.org-detail-panel{flex:1;min-width:0}
.org-info-bar{display:flex;align-items:center;gap:12px;margin-bottom:var(--space-4);flex-wrap:wrap}
.org-info-name{font-size:var(--text-lg);font-weight:var(--font-bold);color:var(--color-text-primary)}
.stat-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:var(--radius-md);font-size:var(--text-xs);background:var(--color-bg);color:var(--color-text-secondary)}
.stat-chip strong{color:var(--color-text-primary);font-weight:var(--font-semibold)}
.factory-switcher{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-md);cursor:pointer;transition:background .15s;font-size:var(--text-sm);color:var(--color-text-secondary)}
.factory-switcher:hover{background:var(--color-bg)}
.factory-dropdown{position:absolute;top:100%;right:0;margin-top:4px;width:180px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:400;display:none}
.factory-dropdown.show{display:block}
.factory-dd-item{padding:8px 14px;font-size:var(--text-sm);cursor:pointer;transition:background .1s;color:var(--color-text-primary)}
.factory-dd-item:hover{background:var(--color-bg)}
.factory-dd-item.active{color:var(--color-primary);font-weight:var(--font-medium)}
</style>
</head>

var selectedNode = null;

function countChildren(node){
  if(!node.children || node.children.length===0) return 0;
  var c = node.children.length;
  node.children.forEach(function(ch){c += countChildren(ch);});
  return c;
}

function renderTreeNode(node, depth, parentEl){
  var hasChildren = node.children && node.children.length > 0;
  var div = document.createElement('div');
  div.className = 'tree-node';
  var row = document.createElement('div');
  row.className = 'tree-node-row';
  row.style.paddingLeft = (12 + depth * 16) + 'px';
  row.setAttribute('data-name', node.name);
  var arrowSpan = document.createElement('span');
  arrowSpan.className = 'tree-arrow' + (hasChildren ? '' : ' leaf');
  arrowSpan.innerHTML = '&#9654;';
  row.appendChild(arrowSpan);
  var iconSvg = node.level === '单位'
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
  var iconSpan = document.createElement('span');
  iconSpan.className = 'tree-icon';
  iconSpan.innerHTML = iconSvg;
  row.appendChild(iconSpan);
  var labelSpan = document.createElement('span');
  labelSpan.className = 'tree-label';
  labelSpan.textContent = node.name;
  row.appendChild(labelSpan);
  var badge = document.createElement('span');
  badge.className = 'tree-badge';
  badge.textContent = node.level;
  row.appendChild(badge);
  div.appendChild(row);
  if(hasChildren){
    var childContainer = document.createElement('div');
    childContainer.className = 'tree-children';
    node.children.forEach(function(ch){
      renderTreeNode(ch, depth+1, childContainer);
    });
    div.appendChild(childContainer);
    row.onclick = function(e){
      e.stopPropagation();
      arrowSpan.classList.toggle('open');
      childContainer.classList.toggle('closed');
      selectNode(node, row);
    };
  } else {
    row.onclick = function(e){
      e.stopPropagation();
      selectNode(node, row);
    };
  }
  parentEl.appendChild(div);
}

function renderTree(){
  var body = document.getElementById('orgTreeBody');
  body.innerHTML = '';
  renderTreeNode(orgTree, 0, body);
}

function filterTree(){
  var keyword = document.getElementById('treeSearch').value.trim().toLowerCase();
  var rows = document.querySelectorAll('.tree-node-row');
  rows.forEach(function(r){
    var name = r.getAttribute('data-name').toLowerCase();
    r.style.display = (!keyword || name.indexOf(keyword) > -1) ? 'flex' : 'none';
  });
}

function selectNode(node, rowEl){
  document.querySelectorAll('.tree-node-row').forEach(function(r){r.classList.remove('active');});
  rowEl.classList.add('active');
  selectedNode = node;
  renderDetail(node);
}

function renderDetail(node){
  var html = '';
  html += '<div class="org-info-bar">';
  html += '<span class="org-info-name">'+node.name+'</span>';
  html += '<button class="btn-sm btn-primary" style="height:28px;font-size:12px;padding:0 12px" onclick="openOrgDialog(selectedNode)">编辑</button>';
  var levelColors = {省级:'blue',市级:'orange',区级:'green',单位:'gray'};
  html += '<span class="status-tag '+(levelColors[node.level]||'blue')+'">'+node.level+'</span>';
  html += '</div>';
  html += '<div style="display:flex;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap">';
  html += '<div class="stat-chip">下级组织数 <strong>'+node.children.length+'</strong></div>';
  html += '<div class="stat-chip">管辖总组织数 <strong>'+countChildren(node)+'</strong></div>';
  html += '<div class="stat-chip">负责人 <strong>'+node.leader+'</strong></div>';
  html += '<div class="stat-chip">人员 <strong>'+node.personnel+'人</strong></div>';
  if(node.region){
    html += '<div class="stat-chip">所属区域 <strong>'+node.region+'</strong></div>';
  }
  html += '</div>';
  if(node.children && node.children.length > 0){
    html += '<div class="page-card" style="padding:0;overflow:hidden">';
    html += '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>名称</th><th>级别</th><th>所属区域</th><th>负责人</th><th>人数</th></tr></thead><tbody>';
    node.children.forEach(function(ch){
      html += '<tr onclick="findAndSelect(\''+ch.name+'\')" style="cursor:pointer"><td style="font-weight:500">'+ch.name+'</td><td><span class="status-tag '+(levelColors[ch.level]||'blue')+'">'+ch.level+'</span></td><td>'+(ch.region||'-')+'</td><td>'+ch.leader+'</td><td>'+ch.personnel+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
  } else {
    html += '<div class="page-card" style="text-align:center;color:var(--color-text-muted);font-size:var(--text-sm);padding:40px">该组织下暂无下级单位</div>';
  }
  document.getElementById('orgDetailContent').innerHTML = html;
}

function findAndSelect(name){
  var rows = document.querySelectorAll('.tree-node-row');
  rows.forEach(function(r){
    if(r.getAttribute('data-name') === name){
      r.click();
    }
  });
}

function openOrgDialog(editNode){
  document.getElementById('orgName').value='';
  document.getElementById('orgLeader').value='';
  document.getElementById('orgPhone').value='';
  document.getElementById('dialogProvince').value='';
  document.getElementById('dialogCity').innerHTML='<option value="">请选择城市</option>';
  document.getElementById('dialogDistrict').innerHTML='<option value="">请选择区县</option>';
  document.getElementById('orgDialogOverlay').querySelector('.dialog-header span').textContent = editNode ? '编辑组织' : '新增组织';
  if(editNode && editNode.region){
    var parts = editNode.region.split('/');
    var prov = parts[0] || '';
    var city = parts[1] || '';
    var dist = parts[2] || '';
    document.getElementById('orgName').value = editNode.name || '';
    document.getElementById('orgLeader').value = editNode.leader || '';
    document.getElementById('orgPhone').value = editNode.phone || '';
    if(prov){
      document.getElementById('dialogProvince').value = prov;
      onProvinceChange();
      if(city){
        document.getElementById('dialogCity').value = city;
        onCityChange();
        if(dist){
          document.getElementById('dialogDistrict').value = dist;
        }
      }
    }
  }
  document.getElementById('orgDialogOverlay').classList.add('show');
}
function closeOrgDialog(){
  document.getElementById('orgDialogOverlay').classList.remove('show');
}
function saveOrg(){
  var name = document.getElementById('orgName').value.trim();
  var leader = document.getElementById('orgLeader').value.trim();
  if(!name){showToast('请输入组织名称','error');return;}
  var prov = document.getElementById('dialogProvince').value;
  var city = document.getElementById('dialogCity').value;
  var dist = document.getElementById('dialogDistrict').value;
  var regionParts = [prov,city,dist].filter(function(s){return s;});
  var regionStr = regionParts.join('/');
  if(selectedNode){
    selectedNode.name = name;
    selectedNode.leader = leader;
    selectedNode.phone = document.getElementById('orgPhone').value.trim();
    selectedNode.region = regionStr || selectedNode.region;
    renderTree();
    renderDetail(selectedNode);
    showToast('组织已更新: '+name,'success');
  } else {
    showToast('组织已添加: '+name + (regionStr ? ' ('+regionStr+')' : ''),'success');
  }
  closeOrgDialog();
}

function showToast(msg,type){
  var container=document.getElementById('toastContainer');
  var t=document.createElement('div');
  t.className='toast '+(type||'info');
  t.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>'+msg+'</span>';
  container.appendChild(t);
  setTimeout(function(){t.remove();},2500);
}

function onProvinceChange(){
  var prov = document.getElementById('dialogProvince').value;
  var citySelect = document.getElementById('dialogCity');
  var distSelect = document.getElementById('dialogDistrict');
  citySelect.innerHTML = '<option value="">请选择城市</option>';
  distSelect.innerHTML = '<option value="">请选择区县</option>';
  if(prov && regionData[prov]){
    Object.keys(regionData[prov]).forEach(function(city){
      citySelect.innerHTML += '<option value="'+city+'">'+city+'</option>';
    });
  }
}
function onCityChange(){
  var prov = document.getElementById('dialogProvince').value;
  var city = document.getElementById('dialogCity').value;
  var distSelect = document.getElementById('dialogDistrict');
  distSelect.innerHTML = '<option value="">请选择区县</option>';
  if(prov && city && regionData[prov] && regionData[prov][city]){
    regionData[prov][city].forEach(function(dist){
      distSelect.innerHTML += '<option value="'+dist+'">'+dist+'</option>';
    });
  }
}
